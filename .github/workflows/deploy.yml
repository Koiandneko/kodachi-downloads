name: Publish downloads
on:
  workflow_dispatch:
  push:
    branches: [main]
  release:
    types: [published]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prepare download files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p public
          gh release download 2026-09-17 --pattern KoiCard.exe --pattern KodachiCard.apk --dir public
          cd public
          echo '45cb63bca0e73e200ecab14a1738366ee0e433315abd08a2018daac0c3148a27  KoiCard.exe' > SHA256SUMS.txt
          echo '8dc3ff06222234c4f88de33e753ed7870863c195262c29b0bf3838a808c8133d  KodachiCard.apk' >> SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          printf 'download.kodachi.top\n' > CNAME
          touch .nojekyll
          cat > index.html <<'HTML'
          <!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kodachi 下载</title><style>body{font:18px/1.8 system-ui,sans-serif;max-width:640px;margin:12vh auto;padding:24px;color:#263228;background:#f6f8f3}a{color:#215c48}li{margin:20px 0}small{color:#566252}</style><h1>Kodachi 下载</h1><ul><li><a href="KoiCard.exe" download>KoiCard.exe</a> <small>Windows · 146 MB</small></li><li><a href="KodachiCard.apk" download>KodachiCard.apk</a> <small>Android · 69 MB</small></li></ul><p><a href="SHA256SUMS.txt">SHA-256 文件校验值</a></p></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
